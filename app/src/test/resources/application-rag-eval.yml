# RAG 测评专用 Profile（P1-01 基线固定配置，入库、不含密钥）
# 基线口径：Chunk 800（生产默认 TokenTextSplitter）+ 关闭 Query 改写
# 对照口径（开启改写）通过环境变量 APP_AI_RAG_REWRITE_ENABLED=true 覆盖，作为独立 run
app:
  ai:
    rag:
      rewrite:
        enabled: ${APP_AI_RAG_REWRITE_ENABLED:false}

# Redis 隔离：测评默认使用独立 database 1，避免消费开发环境 Stream 消息
# （完整覆盖主配置的 redisson config 字符串；REDIS_DATABASE=0 会被测评测试的启动守卫拒绝）
spring:
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: ${REDIS_DATABASE:1}
          connectionMinimumIdleSize: 5
          connectionPoolSize: 20
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 10
